<div class="min-h-screen pb-24"
     style="background: var(--color-bg); color: var(--color-text);">

  <!-- ═══════════════════════════
       TOP BAR — sticky
  ═══════════════════════════ -->
  <div class="sticky top-0 z-20 px-4 pt-3 pb-3 border-b backdrop-blur-md"
       style="background: var(--color-bg);
              border-color: color-mix(in srgb, var(--color-text) 8%, transparent);">

    <!-- 🔎 Búsqueda -->
    <div class="relative flex items-center">
      <svg class="absolute left-3 w-[18px] h-[18px] pointer-events-none opacity-40"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>

      <input
        type="text"
        [(ngModel)]="search"
        (ngModelChange)="onBuscarChange()"
        placeholder="Buscar…"
        class="w-full h-11 pl-10 pr-10 rounded-full border outline-none
               text-[15px] shadow-sm transition-all duration-200"
        style="background: var(--color-bg-sidebar);
               border-color: color-mix(in srgb, var(--color-text) 10%, transparent);
               color: var(--color-text);"
      />

      <button
        *ngIf="search"
        (click)="search=''; onBuscarChange()"
        class="absolute right-3 w-6 h-6 rounded-full flex items-center justify-center
               active:scale-90 transition-all duration-150"
        style="background: var(--color-secondary);"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2.5" width="13" height="13">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- 🧩 Chips filtros -->
    <div *ngIf="filtrosSelect?.length"
         class="flex gap-2 mt-3 overflow-x-auto pb-1
                [&::-webkit-scrollbar]:hidden [scrollbar-width:none]">

      <div *ngFor="let f of filtrosSelect"
           class="relative inline-flex items-center gap-1 px-3 h-[34px]
                  rounded-full border flex-shrink-0">

        <span class="text-[11px] font-semibold uppercase tracking-wider"
              style="color: var(--color-primary)">
          {{ f.label }}
        </span>

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             width="13" height="13"
             style="color: var(--color-primary)">
          <path d="m6 9 6 6 6-6"/>
        </svg>

        <select class="absolute inset-0 opacity-0 w-full cursor-pointer"
                (change)="emitirFiltro(f.key, $any($event.target).value)">
          <option value="">Todos</option>
          <option *ngFor="let op of f.opciones" [value]="op">
            {{ op }}
          </option>
        </select>
      </div>

    </div>
  </div>

  <!-- 🔢 Contador -->
  <p *ngIf="totalItems > 0"
     class="px-4 pt-2 text-[13px] opacity-60 m-0">
    <span class="font-bold"
          style="color: var(--color-primary)">
      {{ totalItems }}
    </span>
    resultado{{ totalItems !== 1 ? 's' : '' }}
  </p>

  <!-- ═══════════════════════════
       TARJETAS
  ═══════════════════════════ -->
  <div *ngIf="items?.length; else sinDatos"
       class="flex flex-col gap-2.5 px-3 pt-2.5">

    <div *ngFor="let item of items; let i = index"
         class="rounded-[18px] shadow-sm overflow-hidden
                active:scale-[.985] transition-transform duration-150 td-card-anim"
         [style.animation-delay]="i * 40 + 'ms'"
         style="background: var(--color-bg-sidebar);
                border: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);">

      <!-- Header -->
      <div class="flex items-center gap-3 px-4 pt-4 pb-2.5">

        <div class="w-11 h-11 rounded-[13px] flex items-center justify-center
                    text-[18px] font-bold text-white flex-shrink-0 select-none"
             style="background: linear-gradient(135deg,
                      var(--color-primary),
                      var(--color-accent));">
          {{ (item[config?.titulo?.key] || '?')[0] | uppercase }}
        </div>

        <div class="flex-1 min-w-0">
          <p class="text-[15px] font-semibold truncate m-0">
            {{ item[config?.titulo?.key] }}
          </p>
          <p *ngIf="config?.subtitulo?.key"
             class="text-[13px] truncate m-0 opacity-50">
            {{ item[config?.subtitulo?.key] }}
          </p>
        </div>

      </div>

      <!-- Campos -->
      <div *ngIf="config?.campos?.length"
           class="flex flex-col gap-1.5 px-4 pb-3">

        <div *ngFor="let campo of config.campos"
             class="flex justify-between items-baseline gap-2">

          <span class="text-[12px] opacity-45 whitespace-nowrap">
            {{ campo.label }}
          </span>

          <span class="text-[13px] font-medium text-right break-words">
            {{ formatear(item[campo.key], campo.tipo) }}
          </span>

        </div>
      </div>

      <!-- Acciones -->
      <div *ngIf="config?.acciones?.length"
           class="flex gap-2 px-4 pt-2 pb-4 border-t
                  overflow-x-auto [&::-webkit-scrollbar]:hidden [scrollbar-width:none]"
           style="border-color: color-mix(in srgb, var(--color-text) 6%, transparent);">

        <button *ngFor="let a of config.acciones"
                (click)="ejecutarAccion(a.accion, item)"
                class="flex-1 min-w-[80px] h-9 rounded-[10px]
                       text-[13px] font-semibold text-white
                       active:scale-95 transition-all duration-150"
                [style]="getBtnStyle(a.color)">
          {{ a.label }}
        </button>

      </div>

    </div>
  </div>

  <!-- Estado vacío -->
  <ng-template #sinDatos>
    <div class="flex flex-col items-center justify-center gap-3 py-20 opacity-40">
      <div class="w-[72px] h-[72px] rounded-[22px] flex items-center justify-center"
           style="background: color-mix(in srgb, var(--color-text) 10%, transparent);">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5"
             width="36" height="36">
          <path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7"/>
          <path d="M2 17h20v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2z"/>
        </svg>
      </div>
      <p class="text-[15px] font-medium m-0">Sin resultados</p>
    </div>
  </ng-template>

  <!-- ═══════════════════════════
       PAGINACIÓN
  ═══════════════════════════ -->
  <div *ngIf="totalPaginas > 1"
       class="flex items-center justify-center flex-wrap gap-1.5 px-3 py-5">

    <button
      [disabled]="paginaActual === 1"
      (click)="irAPagina(paginaActual - 1)"
      class="w-10 h-10 rounded-[10px] active:scale-90 transition-all duration-150"
      style="background: var(--color-bg-sidebar);
             border:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);"
    >
      ‹
    </button>

    <ng-container *ngFor="let p of paginasVisibles">
      <button
        (click)="irAPagina(p)"
        class="min-w-[40px] h-10 px-2 rounded-[10px]
               text-[14px] font-medium active:scale-90 transition-all duration-150"
        [style]="p === paginaActual
          ? 'background:var(--color-primary);color:white;'
          : 'background:var(--color-bg-sidebar);color:var(--color-text);'"
      >
        {{ p }}
      </button>
    </ng-container>

    <button
      [disabled]="paginaActual === totalPaginas"
      (click)="irAPagina(paginaActual + 1)"
      class="w-10 h-10 rounded-[10px] active:scale-90 transition-all duration-150"
      style="background: var(--color-bg-sidebar);
             border:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);"
    >
      ›
    </button>

  </div>

</div>

<style>
  @keyframes tdIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .td-card-anim {
    animation: tdIn .28s cubic-bezier(.4,0,.2,1) both;
  }
</style>
