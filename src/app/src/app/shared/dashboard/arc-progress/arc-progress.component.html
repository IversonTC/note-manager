<div class="rounded-2xl p-4 flex flex-col items-center gap-0 h-full relative"
     style="background:var(--color-bg-sidebar);
            border:1px solid color-mix(in srgb,var(--color-primary) 10%,transparent)"
     (mousemove)="onSvgMove($event)" (mouseleave)="onLeave()">

  @if (titulo) {
    <p class="text-sm font-semibold w-full mb-2" style="color:var(--color-text)">{{ titulo }}</p>
  }

  @if (cargando) {
    <div class="flex-1 min-h-0 w-full rounded-xl animate-pulse"
         style="background:color-mix(in srgb,var(--color-primary) 10%,transparent)"></div>
  } @else {
    <div class="flex-1 min-h-0 flex items-center justify-center w-full">
    <svg viewBox="16 12 168 102" xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet"
         class="w-full h-full max-w-[260px] mx-auto select-none"
         (mouseenter)="onSvgEnter()">

      <!-- Pista de fondo -->
      <path [attr.d]="arcD"
            fill="none"
            stroke="color-mix(in srgb,var(--color-text) 8%,transparent)"
            [attr.stroke-width]="STROKE"
            stroke-linecap="round"/>

      <!-- Arco de progreso -->
      <path [attr.d]="arcD"
            fill="none"
            [attr.stroke]="color"
            [attr.stroke-width]="STROKE"
            stroke-linecap="round"
            [attr.stroke-dasharray]="dashFilled"
            stroke-dashoffset="0"
            style="transition: stroke-dasharray .7s cubic-bezier(.4,0,.2,1)"/>

      <!-- Punto marcador al final del arco -->
      @if (pct > 0.03 && pct < 0.97) {
        <circle [attr.cx]="dotX" [attr.cy]="dotY" r="4"
                fill="white"
                [attr.stroke]="color" stroke-width="2"
                style="transition: cx .7s cubic-bezier(.4,0,.2,1), cy .7s cubic-bezier(.4,0,.2,1)"/>
      }

      <!-- Porcentaje grande -->
      <text [attr.x]="CX" [attr.y]="CY - 18"
            text-anchor="middle"
            font-size="30" font-weight="900"
            [attr.fill]="color"
            style="transition: fill .35s ease">
        {{ porcentajeTexto }}
      </text>

      <!-- Valor / Máximo -->
      <text [attr.x]="CX" [attr.y]="CY - 5"
            text-anchor="middle" font-size="9"
            style="fill:color-mix(in srgb,var(--color-text) 45%,transparent)">
        {{ valor | number:'1.0-0' }} / {{ maximo | number:'1.0-0' }}{{ unidad ? ' ' + unidad : '' }}
      </text>

      <!-- Etiquetas 0 / max -->
      <text [attr.x]="CX - R - 2" [attr.y]="CY + 12"
            text-anchor="middle" font-size="8" font-weight="600"
            style="fill:color-mix(in srgb,var(--color-text) 35%,transparent)">0</text>
      <text [attr.x]="CX + R + 2" [attr.y]="CY + 12"
            text-anchor="middle" font-size="8" font-weight="600"
            style="fill:color-mix(in srgb,var(--color-text) 35%,transparent)">
        {{ maximo | number:'1.0-0' }}
      </text>

    </svg>
    </div>

    @if (subtitulo) {
      <p class="text-xs text-center" style="color:var(--color-text); opacity:.5">
        {{ subtitulo }}
      </p>
    }
  }

  <app-chart-tooltip [state]="tooltip" [containerW]="containerW" />
</div>
